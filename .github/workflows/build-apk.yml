          package io.github.atexidk.bunnyapp;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.TypedValue;
          import android.widget.RemoteViews;
          import androidx.core.graphics.ColorUtils;
          import androidx.core.graphics.PathParser;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class BunnyWidgetMore {
            static final int NEXT = 3, MOOD = 4, WEEK = 5, MEALS = 6, PARTNER = 7, WQ = 8, CKME = 9, CKTH = 10;
            static final String PEND = "pending";
            static final String[] MOODN = {"Low", "Meh", "Okay", "Good", "Great"};
            static final String HEART = "M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 5 6.4 5c2 0 3.7 1.1 4.6 2.7h2C13.9 6.1 15.6 5 17.6 5 21 5 23.1 8.3 21.6 11.8 19.5 16.4 12 21 12 21z";
            static final String CHECK = "M5 12.5l4.5 4.5L19 7.5";

            static SharedPreferences sp(Context c) {
              return c.getSharedPreferences(BunnyWidget.PREFS, 0);
            }

            static JSONArray pending(Context c) {
              try {
                String s = sp(c).getString(PEND, null);
                if (s != null && s.length() > 1) return new JSONArray(s);
              } catch (Exception e) {
              }
              return new JSONArray();
            }

            /* the app calls this when it opens: hands over every tap made on a widget and clears the queue */
            public static String takePending(Context c) {
              try {
                String s = sp(c).getString(PEND, "");
                sp(c).edit().remove(PEND).apply();
                return s == null ? "" : s;
              } catch (Exception e) {
                return "";
              }
            }

            /* a tap on a widget button: queue it for the app and show the result on the widget straight away */
            static void act(Context c, String a, String v) {
              if (a == null) return;
              if ("refresh".equals(a)) {
                BunnyWidget.refresh(c);
                return;
              }
              long now = System.currentTimeMillis();
              SharedPreferences s = sp(c);
              if ("cheer".equals(a)) {
                if (now - s.getLong("cheerAt", 0L) < 60000L) return;
                s.edit().putLong("cheerAt", now).apply();
                try {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  Intent it = new Intent(c, BunnyWidgetAct.class);
                  it.setData(Uri.parse("bunny://act/refresh/0/" + now));
                  it.putExtra("a", "refresh");
                  PendingIntent pi = PendingIntent.getBroadcast(c, 77, it, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  if (am != null) am.set(AlarmManager.RTC, now + 62000L, pi);
                } catch (Exception e) {
                }
              }
              try {
                JSONArray p = pending(c);
                JSONObject x = new JSONObject();
                x.put("a", a);
                x.put("k", BunnyWidget.today());
                x.put("t", now);
                if ("tick".equals(a)) x.put("r", v == null ? "" : v);
                else if ("water".equals(a)) x.put("v", Integer.parseInt(v));
                else if ("mood".equals(a)) x.put("i", Integer.parseInt(v));
                p.put(x);
                JSONArray q = p;
                if (p.length() > 60) {
                  q = new JSONArray();
                  for (int i = p.length() - 60; i < p.length(); i++) q.put(p.get(i));
                }
                s.edit().putString(PEND, q.toString()).apply();
              } catch (Exception e) {
              }
              BunnyWidget.refresh(c);
            }

            static PendingIntent act(Context c, String a, String v, int code) {
              Intent it = new Intent(c, BunnyWidgetAct.class);
              it.setData(Uri.parse("bunny://act/" + a + "/" + v + "/" + code));
              it.putExtra("a", a);
              it.putExtra("v", v);
              return PendingIntent.getBroadcast(c, code, it, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }

            /* last pushed summary from the app, with any taps that are still waiting for the app laid on top */
            static JSONObject state(Context c) {
              JSONObject j = new JSONObject();
              try {
                String raw = sp(c).getString("json", null);
                if (raw != null) j = new JSONObject(raw);
              } catch (Exception e) {
                j = new JSONObject();
              }
              String td = BunnyWidget.today();
              boolean fresh = td.equals(j.optString("day"));
              try {
                if (!fresh) {
                  j.put("done", 0);
                  j.put("water", 0);
                  j.put("nx", new JSONArray());
                  j.put("wm", -1);
                  JSONArray ml = j.optJSONArray("ml");
                  if (ml != null) {
                    for (int i = 0; i < ml.length(); i++) {
                      JSONArray e = ml.optJSONArray(i);
                      if (e != null) e.put(1, 0);
                    }
                  }
                }
                j.put("fresh", fresh);
                JSONArray pd = pending(c);
                for (int i = 0; i < pd.length(); i++) {
                  JSONObject x = pd.optJSONObject(i);
                  if (x == null || !td.equals(x.optString("k"))) continue;
                  String a = x.optString("a");
                  if ("tick".equals(a)) {
                    JSONArray nx = j.optJSONArray("nx");
                    if (nx != null) {
                      for (int k = 0; k < nx.length(); k++) {
                        JSONArray n = nx.optJSONArray(k);
                        if (n != null && x.optString("r").equals(n.optString(0))) {
                          nx.remove(k);
                          j.put("done", j.optInt("done") + 1);
                          break;
                        }
                      }
                    }
                  } else if ("water".equals(a)) {
                    j.put("water", j.optInt("water") + x.optInt("v"));
                  } else if ("mood".equals(a)) {
                    j.put("wm", x.optInt("i"));
                  }
                }
                j.put("cheerAt", sp(c).getLong("cheerAt", 0L));
              } catch (Exception e) {
              }
              return j;
            }

            static Paint tp(Typeface tf, int col, float size, boolean bold) {
              return BunnyWidget.tp(tf, col, size, bold);
            }

            static void txt(Canvas cv, String s, float x, float base, Paint p, float maxW, float size) {
              BunnyWidget.fit(p, s, maxW, size);
              cv.drawText(s, x, base, p);
            }

            static void card(Canvas cv, int w, int h, float u, BunnyWidget.Pal p, int bg) {
              float r = Math.min(28f * u, h / 2f);
              cv.drawRoundRect(new RectF(0, 0, w, h), r, r, BunnyWidget.fill(bg));
            }

            static Path glyph(String d, float ox, float oy, float s) {
              Path p = PathParser.createPathFromPathData(d);
              if (p == null) return new Path();
              Matrix mx = new Matrix();
              mx.setScale(s, s);
              mx.postTranslate(ox, oy);
              p.transform(mx);
              return p;
            }

            static String cap(String s) {
              if (s == null || s.length() == 0) return "";
              return s.substring(0, 1).toUpperCase() + s.substring(1);
            }

            static String ago(long la) {
              if (la <= 0) return "";
              long m = (System.currentTimeMillis() - la) / 60000L;
              if (m < 2) return "just now";
              if (m < 60) return m + "m ago";
              long h = m / 60;
              if (h < 24) return h + "h ago";
              return (h / 24) + "d ago";
            }

            static RemoteViews build(Context c, AppWidgetManager m, int id, int kind) {
              float dn = c.getResources().getDisplayMetrics().density;
              Bundle o = m.getAppWidgetOptions(id);
              int wdp = o == null ? 0 : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0);
              int hdp = o == null ? 0 : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0);
              boolean wide = kind == NEXT || kind == MOOD || kind == WEEK || kind == PARTNER || kind == WQ;
              if (wdp <= 0) wdp = wide ? 320 : 150;
              if (hdp <= 0) hdp = kind == NEXT ? 78 : (wide ? 148 : 150);
              int w = Math.round(wdp * dn);
              int h = Math.round(hdp * dn);
              float budget = 1400000f / ((float) w * (float) h);
              if (budget < 1f) {
                float k = (float) Math.sqrt(budget);
                w = Math.round(w * k);
                h = Math.round(h * k);
              }
              float u = w / (float) wdp;
              JSONObject j = state(c);
              int acc = 0xFFC6E852;
              try {
                String a = j.optString("accent", "");
                if (a.startsWith("#")) acc = Color.parseColor(a);
              } catch (Exception e) {
              }
              BunnyWidget.Pal p = BunnyWidget.palFor(c, acc, j.optBoolean("dark", false));
              Typeface tf = BunnyWidget.base(c);
              String pk = c.getPackageName();
              Bitmap b = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
              Canvas cv = new Canvas(b);
              RemoteViews v;

              if (kind == CKME || kind == CKTH) {
                JSONObject ck = j.optJSONObject("ck");
                if (ck == null) ck = new JSONObject();
                boolean me = kind == CKME;
                String tz = ck.optString("tz", "");
                boolean h24 = ck.optBoolean("h24", false);
                boolean dk = ColorUtils.calculateLuminance(p.bg) < 0.5;
                int cf = me ? p.pr : ColorUtils.blendARGB(p.tc, p.onTc, dk ? 0.85f : 0.65f);
                card(cv, w, h, u, p, p.bg);
                float dcp = 0.88f * Math.min(0.56f * w, 0.62f * h);
                BunnyWidget.cookie(cv, 0.28f * w, 0.31f * h, dcp / 2f, BunnyWidget.fill(cf));
                float pwp = 0.44f * w;
                float php = 0.27f * h;
                float pcx = 0.76f * w;
                float pcy = 0.81f * h;
                cv.drawRoundRect(new RectF(pcx - pwp / 2f, pcy - php / 2f, pcx + pwp / 2f, pcy + php / 2f), php / 2f, php / 2f, BunnyWidget.fill(p.track));
                String lab;
                if (me) {
                  lab = ck.optString("my", "");
                } else {
                  String nm0 = ck.optString("them", "");
                  String city = ck.optString("city", "");
                  if (tz.length() == 0) lab = "Set up in app";
                  else lab = nm0.length() > 0 ? nm0 : city;
                }
                if (lab.length() > 14) lab = lab.substring(0, 14);
                float ddp = 0.88f * Math.min(0.56f * wdp, 0.62f * hdp);
                float hsz = 0.6f * ddp;
                float msz = Math.min(0.27f * hdp * 0.95f, 0.44f * wdp * 0.58f);
                float dsz = Math.max(9f, 0.08f * wdp);
                v = new RemoteViews(pk, R.layout.widget_clock);
                v.setImageViewBitmap(R.id.img, b);
                v.setTextViewTextSize(R.id.hh, TypedValue.COMPLEX_UNIT_DIP, hsz);
                v.setTextViewTextSize(R.id.mm, TypedValue.COMPLEX_UNIT_DIP, msz);
                v.setTextViewTextSize(R.id.dt, TypedValue.COMPLEX_UNIT_DIP, dsz);
                v.setTextViewTextSize(R.id.nm, TypedValue.COMPLEX_UNIT_DIP, dsz);
                v.setTextColor(R.id.hh, p.bg);
                v.setTextColor(R.id.mm, p.on);
                v.setTextColor(R.id.dt, p.sub);
                v.setTextColor(R.id.nm, p.on);
                String hf = h24 ? "HH" : "hh";
                v.setCharSequence(R.id.hh, "setFormat12Hour", hf);
                v.setCharSequence(R.id.hh, "setFormat24Hour", hf);
                v.setCharSequence(R.id.mm, "setFormat12Hour", "mm");
                v.setCharSequence(R.id.mm, "setFormat24Hour", "mm");
                v.setCharSequence(R.id.dt, "setFormat12Hour", "EEE, MMM d");
                v.setCharSequence(R.id.dt, "setFormat24Hour", "EEE, MMM d");
                if (lab.length() > 0) {
                  String nf2 = "'" + lab.replace("'", "''") + "'";
                  v.setCharSequence(R.id.nm, "setFormat12Hour", nf2);
                  v.setCharSequence(R.id.nm, "setFormat24Hour", nf2);
                } else {
                  v.setViewVisibility(R.id.nm, android.view.View.GONE);
                }
                if (!me && tz.length() > 0) {
                  v.setString(R.id.hh, "setTimeZone", tz);
                  v.setString(R.id.mm, "setTimeZone", tz);
                  v.setString(R.id.dt, "setTimeZone", tz);
                }
                v.setContentDescription(R.id.img, lab.length() > 0 ? lab : "Clock");
                v.setOnClickPendingIntent(R.id.tapL, BunnyWidget.open(c, "home", me ? 40 : 41));
                return v;
              }

              int done = j.optInt("done");
              int total = j.optInt("total");

              if (kind == NEXT) {
                drawNext(cv, w, h, u, j, p, tf);
                v = new RemoteViews(pk, R.layout.widget_next);
