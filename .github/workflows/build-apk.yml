                  v.setOnClickPendingIntent(R.id.tapR, BunnyWidget.open(c, "planner", 22));
                  v.setContentDescription(R.id.img, done + " of " + total + " routines done");
                }
              } else if (kind == MOOD) {
                drawMood(cv, w, h, u, j, p, tf);
                v = new RemoteViews(pk, R.layout.widget_mood);
                v.setOnClickPendingIntent(R.id.tapL, BunnyWidget.open(c, "home", 23));
                int[] ids = {R.id.b0, R.id.b1, R.id.b2, R.id.b3, R.id.b4};
                for (int i = 0; i < 5; i++) {
                  v.setOnClickPendingIntent(ids[i], act(c, "mood", String.valueOf(i), 24 + i));
                }
                v.setContentDescription(R.id.img, "How are you feeling? Five mood buttons");
              } else if (kind == WEEK) {
                drawWeek(cv, w, h, u, j, p, tf);
                v = new RemoteViews(pk, R.layout.widget_bunny);
                v.setOnClickPendingIntent(R.id.tapL, BunnyWidget.open(c, "progress", 30));
                v.setOnClickPendingIntent(R.id.tapR, BunnyWidget.open(c, "progress", 31));
                v.setContentDescription(R.id.img, "This week, " + j.optInt("wkp") + " percent of routines done");
              } else if (kind == MEALS) {
                drawMeals(cv, w, h, u, j, p, tf);
                v = new RemoteViews(pk, R.layout.widget_bunny);
                v.setOnClickPendingIntent(R.id.tapL, BunnyWidget.open(c, "routines", 32));
                v.setOnClickPendingIntent(R.id.tapR, BunnyWidget.open(c, "routines", 33));
                v.setContentDescription(R.id.img, "Meals logged today");
              } else if (kind == PARTNER) {
                drawPartner(cv, w, h, u, j, p, tf);
                v = new RemoteViews(pk, R.layout.widget_partner);
                v.setOnClickPendingIntent(R.id.tapL, BunnyWidget.open(c, "partner", 34));
                v.setOnClickPendingIntent(R.id.tapS, BunnyWidget.open(c, "partner", 35));
                v.setOnClickPendingIntent(R.id.tapR, BunnyWidget.open(c, "partner", 36));
                if (j.optJSONObject("pn") != null) v.setOnClickPendingIntent(R.id.b1, act(c, "cheer", "", 37));
                else v.setOnClickPendingIntent(R.id.b1, BunnyWidget.open(c, "partner", 38));
                v.setContentDescription(R.id.img, "Partner progress. Tap the heart button to send a cheer");
              } else {
                drawWaterQuick(cv, w, h, u, j, p, tf);
                v = new RemoteViews(pk, R.layout.widget_wq);
                v.setOnClickPendingIntent(R.id.tapL, BunnyWidget.open(c, "routines", 50));
                v.setOnClickPendingIntent(R.id.b0, act(c, "water", "200", 51));
                v.setOnClickPendingIntent(R.id.b1, act(c, "water", "300", 52));
                v.setOnClickPendingIntent(R.id.b2, act(c, "water", "500", 53));
                v.setContentDescription(R.id.img, BunnyWidget.nf(j.optInt("water")) + " of " + BunnyWidget.nf(j.optInt("goal", 2000)) + " millilitres. Buttons add 200, 300 or 500");
              }
              v.setImageViewBitmap(R.id.img, b);
              return v;
            }

            /* ---------- W1: up next (4x1) ---------- */
            static void drawNext(Canvas cv, int w, int h, float u, JSONObject j, BunnyWidget.Pal p, Typeface tf) {
              card(cv, w, h, u, p, p.bg);
              float pad = 14f * u;
              float cd = Math.min(50f * u, h - 12f * u);
              float cx = pad + cd / 2f;
              float cy = h / 2f;
              BunnyWidget.cookie(cv, cx, cy, cd / 2f, BunnyWidget.fill(p.pc));
              Paint ic = new Paint(Paint.ANTI_ALIAS_FLAG);
              ic.setStyle(Paint.Style.STROKE);
              ic.setColor(p.onPc);
              ic.setStrokeWidth(cd * 0.05f);
              ic.setStrokeCap(Paint.Cap.ROUND);
              ic.setStrokeJoin(Paint.Join.ROUND);
              cv.drawCircle(cx, cy, cd * 0.18f, ic);
              Path hands = new Path();
              hands.moveTo(cx, cy - cd * 0.095f);
              hands.lineTo(cx, cy);
              hands.lineTo(cx + cd * 0.065f, cy + cd * 0.045f);
              cv.drawPath(hands, ic);

              JSONArray nx = j.optJSONArray("nx");
              boolean has = nx != null && nx.length() > 0;
              String lab;
              String title;
              if (has) {
                JSONArray n0 = nx.optJSONArray(0);
                title = n0.optString(1);
                String g = cap(n0.optString(2));
                lab = g.length() > 0 ? "Up next \u00b7 " + g : "Up next";
              } else if (j.optInt("total") > 0 && j.optInt("done") >= j.optInt("total")) {
                lab = "All done";
                title = "Nice work today!";
              } else {
                lab = "Up next";
                title = j.optBoolean("fresh", false) ? "Nothing left today" : "Open Bunny to start";
              }
              float bd = Math.min(48f * u, h - 14f * u);
              float bx = w - pad - bd / 2f;
              float x0 = pad + cd + 12f * u;
              float maxW = bx - bd / 2f - 10f * u - x0;
              Paint lp = tp(tf, p.sub, 12f * u, true);
              txt(cv, lab, x0, cy - 5f * u, lp, maxW, 12f * u);
              Paint tp2 = tp(tf, p.on, 19f * u, true);
              txt(cv, title, x0, cy + 17f * u, tp2, maxW, 19f * u);
              cv.drawCircle(bx, cy, bd / 2f, BunnyWidget.fill(has ? p.pr : p.pc));
              Paint ck = new Paint(Paint.ANTI_ALIAS_FLAG);
              ck.setStyle(Paint.Style.STROKE);
              ck.setColor(has ? p.bg : p.onPc);
              ck.setStrokeWidth(3.2f * u);
              ck.setStrokeCap(Paint.Cap.ROUND);
              ck.setStrokeJoin(Paint.Join.ROUND);
              float s = 22f * u / 24f;
              cv.drawPath(glyph(CHECK, bx - 11f * u, cy - 11f * u, s), ck);
            }

            /* ---------- W2: mood (4x2) ---------- */
            static void face(Canvas cv, int i, float cx, float cy, float size, int col) {
              float s = size / 100f;
              float ox = cx - size / 2f;
              float oy = cy - size / 2f;
              Paint f = BunnyWidget.fill(col);
              cv.drawCircle(ox + 35 * s, oy + 42 * s, 5 * s, f);
              cv.drawCircle(ox + 65 * s, oy + 42 * s, 5 * s, f);
              Paint st = new Paint(Paint.ANTI_ALIAS_FLAG);
              st.setColor(col);
              st.setStyle(Paint.Style.STROKE);
              st.setStrokeWidth(6 * s);
              st.setStrokeCap(Paint.Cap.ROUND);
              st.setStrokeJoin(Paint.Join.ROUND);
              Path pa = new Path();
              if (i == 0) {
                pa.moveTo(ox + 33 * s, oy + 68 * s);
                pa.quadTo(ox + 50 * s, oy + 54 * s, ox + 67 * s, oy + 68 * s);
              } else if (i == 1) {
                pa.moveTo(ox + 35 * s, oy + 66 * s);
                pa.quadTo(ox + 50 * s, oy + 59 * s, ox + 65 * s, oy + 66 * s);
              } else if (i == 2) {
                pa.moveTo(ox + 35 * s, oy + 62 * s);
                pa.lineTo(ox + 65 * s, oy + 62 * s);
              } else if (i == 3) {
                pa.moveTo(ox + 33 * s, oy + 58 * s);
                pa.quadTo(ox + 50 * s, oy + 74 * s, ox + 67 * s, oy + 58 * s);
              } else {
                pa.moveTo(ox + 30 * s, oy + 55 * s);
                pa.quadTo(ox + 50 * s, oy + 80 * s, ox + 70 * s, oy + 55 * s);
                pa.close();
                cv.drawPath(pa, f);
              }
              cv.drawPath(pa, st);
            }

            static void drawMood(Canvas cv, int w, int h, float u, JSONObject j, BunnyWidget.Pal p, Typeface tf) {
              card(cv, w, h, u, p, p.bg);
              float pad = 14f * u;
              int wm = j.optInt("wm", -1);
              String lab = wm >= 0 && wm < 5 ? "Today \u00b7 " + MOODN[wm] : "Today";
              Paint lp = tp(tf, p.sub, 12f * u, true);
              txt(cv, lab, pad, pad + 10f * u, lp, w - 2 * pad, 12f * u);
              Paint tp2 = tp(tf, p.on, 20f * u, true);
              txt(cv, "How are you feeling?", pad, pad + 38f * u, tp2, w - 2 * pad, 20f * u);
              float rowTop = h * 0.45f;
              float rowH = h - rowTop;
              float cy = rowTop + rowH / 2f;
              float colW = (w - 2 * pad) / 5f;
              float bd = Math.min(52f * u, Math.min(colW - 6f * u, rowH * 0.82f));
              for (int i = 0; i < 5; i++) {
                float cx = pad + (i + 0.5f) * colW;
                boolean on = i == wm;
                if (on) BunnyWidget.cookie(cv, cx, cy, bd / 2f * 1.1f, BunnyWidget.fill(p.pc));
                else cv.drawCircle(cx, cy, bd / 2f, BunnyWidget.fill(p.track));
                face(cv, i, cx, cy, bd * 0.66f, on ? p.onPc : p.on);
              }
            }

            /* ---------- W4: this week (4x2) ---------- */
            static void drawWeek(Canvas cv, int w, int h, float u, JSONObject j, BunnyWidget.Pal p, Typeface tf) {
              card(cv, w, h, u, p, p.bg);
              float pad = 14f * u;
              String chip = j.optInt("wkp") + "% done";
              float ch = 24f * u;
              float ct = pad - 2f * u;
              Paint cp = tp(tf, p.onPc, 12f * u, true);
              float cwid = cp.measureText(chip) + 22f * u;
              float cx0 = w - pad - cwid;
              cv.drawRoundRect(new RectF(cx0, ct, w - pad, ct + ch), ch / 2f, ch / 2f, BunnyWidget.fill(p.pc));
              cv.drawText(chip, cx0 + 11f * u, ct + ch / 2f + BunnyWidget.mid(cp), cp);
              Paint lp = tp(tf, p.sub, 12f * u, true);
              cv.drawText("This week", pad, ct + ch / 2f + BunnyWidget.mid(lp), lp);
              JSONArray wk = j.optJSONArray("wk");
              JSONArray wl = j.optJSONArray("wl");
              int wo = j.optInt("wo", -1);
              float top = ct + ch + 8f * u;
              float labH = 16f * u;
              float bot = h - pad - labH - 2f * u;
              float bh = bot - top;
              if (bh < 10f * u) bh = 10f * u;
              float colW = (w - 2 * pad) / 7f;
              float bw = Math.min(26f * u, colW - 4f * u);
              for (int i = 0; i < 7; i++) {
                float cx = pad + (i + 0.5f) * colW;
                RectF tr = new RectF(cx - bw / 2f, bot - bh, cx + bw / 2f, bot);
                cv.drawRoundRect(tr, bw / 2f, bw / 2f, BunnyWidget.fill(p.track));
                int pc = wk == null ? 0 : Math.max(0, Math.min(100, wk.optInt(i)));
                if (pc > 0) {
                  cv.save();
                  Path cl = new Path();
                  cl.addRoundRect(tr, bw / 2f, bw / 2f, Path.Direction.CW);
                  cv.clipPath(cl);
                  cv.drawRect(tr.left, bot - bh * pc / 100f, tr.right, bot, BunnyWidget.fill(p.pr));
                  cv.restore();
                }
                String L = wl == null ? "" : wl.optString(i);
                boolean td = i == wo;
                Paint tl = tp(tf, td ? p.onPc : p.sub, 11f * u, true);
                tl.setTextAlign(Paint.Align.CENTER);
                float ly = bot + 3f * u;
                if (td) {
                  float tw = tl.measureText(L) + 14f * u;
                  cv.drawRoundRect(new RectF(cx - tw / 2f, ly, cx + tw / 2f, ly + 15f * u), 8f * u, 8f * u, BunnyWidget.fill(p.pc));
                }
                cv.drawText(L, cx, ly + 7.5f * u + BunnyWidget.mid(tl), tl);
              }
            }

            /* ---------- W5: meals (2x2) ---------- */
            static void drawMeals(Canvas cv, int w, int h, float u, JSONObject j, BunnyWidget.Pal p, Typeface tf) {
              card(cv, w, h, u, p, p.bg);
              float pad = 14f * u;
              JSONArray ml = j.optJSONArray("ml");
              int n = ml == null ? 0 : ml.length();
              int got = 0;
              for (int i = 0; i < n; i++) {
                JSONArray e = ml.optJSONArray(i);
                if (e != null && e.optInt(1) > 0) got++;
              }
              Paint lp = tp(tf, p.sub, 12f * u, true);
              cv.drawText("Meals today", pad, pad + 10f * u, lp);
              Paint bp = tp(tf, p.on, 44f * u, true);
              String big = String.valueOf(got);
              float by = pad + 10f * u + 8f * u + 38f * u;
              cv.drawText(big, pad, by, bp);
              float bwid = bp.measureText(big);
              Paint sp2 = tp(tf, p.sub, 24f * u, true);
              cv.drawText("/" + n, pad + bwid + 1f * u, by, sp2);
              if (n > 0) {
                float gap = n > 5 ? 3f * u : 6f * u;
                float bw = (w - 2 * pad - gap * (n - 1)) / n;
                float barH = 14f * u;
                float lbl = 12f * u;
                float barTop = h - pad - lbl - 3f * u - barH;
                for (int i = 0; i < n; i++) {
                  JSONArray e = ml.optJSONArray(i);
                  boolean on = e != null && e.optInt(1) > 0;
                  float x = pad + i * (bw + gap);
                  cv.drawRoundRect(new RectF(x, barTop, x + bw, barTop + barH), barH / 2f, barH / 2f, BunnyWidget.fill(on ? p.pr : p.track));
                  Paint tl = tp(tf, p.sub, 10f * u, true);
                  tl.setTextAlign(Paint.Align.CENTER);
                  cv.drawText(e == null ? "" : e.optString(0), x + bw / 2f, h - pad - 1f * u, tl);
                }
              } else {
                Paint np = tp(tf, p.sub, 12f * u, false);
                cv.drawText("Open Care to pick meals", pad, h - pad, np);
              }
            }

            /* ---------- W6: partner (4x2) ---------- */
            static void drawPartner(Canvas cv, int w, int h, float u, JSONObject j, BunnyWidget.Pal p, Typeface tf) {
              card(cv, w, h, u, p, p.bg);
              float pad = 14f * u;
              JSONObject pn = j.optJSONObject("pn");
              float ad = Math.min(78f * u, h - 2 * pad - 38f * u);
              if (ad < 40f * u) ad = 40f * u;
              float acx = pad + ad / 2f;
              float acy = pad + ad / 2f;
              BunnyWidget.cookie(cv, acx, acy, ad / 2f, BunnyWidget.fill(p.tc));
              String name = pn == null ? "" : pn.optString("n", "");
              String ini = name.length() > 0 ? name.substring(0, 1).toUpperCase() : "?";
              Paint ip = tp(tf, p.onTc, 34f * u, true);
              ip.setTextAlign(Paint.Align.CENTER);
              cv.drawText(ini, acx, acy + BunnyWidget.mid(ip), ip);
              float x0 = pad + 78f * u + 14f * u;
              float maxW = w - pad - x0;
              String lab;
              String head;
              float frac = 0f;
              if (pn == null) {
                lab = "Partner";
                head = "Not linked yet";
              } else {
                String ag = ago(pn.optLong("la", 0L));
                lab = ag.length() > 0 ? name + " \u00b7 " + ag : name;
                int dn = pn.optInt("done", -1);
                int tt = pn.optInt("total", -1);
                int pc = pn.optInt("p", -1);
                if (dn >= 0 && tt > 0) {
                  head = dn + " of " + tt + " routines";
                  frac = dn / (float) tt;
                } else if (pc >= 0) {
                  head = pc + "% done today";
                  frac = pc / 100f;
                } else {
                  head = "Progress is private";
                }
              }
              Paint lp = tp(tf, p.sub, 12f * u, true);
              txt(cv, lab, x0, pad + 11f * u, lp, maxW, 12f * u);
              Paint hp = tp(tf, p.on, 20f * u, true);
              txt(cv, head, x0, pad + 11f * u + 3f * u + 20f * u, hp, maxW, 20f * u);
              float barTop = pad + 11f * u + 3f * u + 20f * u + 9f * u;
              float bh = 10f * u;
              cv.drawRoundRect(new RectF(x0, barTop, w - pad, barTop + bh), bh / 2f, bh / 2f, BunnyWidget.fill(p.track));
              if (frac > 0f) {
                float fw = Math.max(bh, (w - pad - x0) * Math.min(1f, frac));
                cv.drawRoundRect(new RectF(x0, barTop, x0 + fw, barTop + bh), bh / 2f, bh / 2f, BunnyWidget.fill(p.pr));
              }
              boolean sent = System.currentTimeMillis() - j.optLong("cheerAt", 0L) < 60000L;
              float bt = h - pad - 34f * u;
              float bwid = 128f * u;
              RectF br = new RectF(x0, bt, x0 + bwid, bt + 34f * u);
              int bfill = pn == null || sent ? p.pc : p.pr;
              int bfg = pn == null || sent ? p.onPc : p.bg;
              cv.drawRoundRect(br, 17f * u, 17f * u, BunnyWidget.fill(bfill));
              Paint hf = new Paint(Paint.ANTI_ALIAS_FLAG);
              hf.setColor(bfg);
              cv.drawPath(glyph(HEART, x0 + 14f * u, bt + 9f * u, 16f * u / 24f), hf);
              String bl = pn == null ? "Open partner" : (sent ? "Cheer sent" : "Send a cheer");
              Paint bp = tp(tf, bfg, 13f * u, true);
              txt(cv, bl, x0 + 37f * u, bt + 17f * u + BunnyWidget.mid(bp), bp, bwid - 37f * u - 10f * u, 13f * u);
            }

            /* ---------- W7: water, quick add (4x2) ---------- */
            static void drawWaterQuick(Canvas cv, int w, int h, float u, JSONObject j, BunnyWidget.Pal p, Typeface tf) {
              card(cv, w, h, u, p, p.bg);
              float pad = 14f * u;
              int water = j.optInt("water");
              int goal = j.optInt("goal", 2000);
              if (goal <= 0) goal = 2000;
              float colR = w - pad - 92f * u - 16f * u;
              float maxW = colR - pad;
              Paint lp = tp(tf, p.sub, 12f * u, true);
              cv.drawText("Water", pad, pad + 10f * u, lp);
              Paint bp = tp(tf, p.on, 38f * u, true);
              txt(cv, BunnyWidget.nf(water), pad, pad + 10f * u + 6f * u + 34f * u, bp, maxW, 38f * u);
              Paint gp = tp(tf, p.sub, 12f * u, true);
              txt(cv, "of " + BunnyWidget.nf(goal) + " ml", pad, pad + 10f * u + 6f * u + 34f * u + 18f * u, gp, maxW, 12f * u);
              float bh = 10f * u;
              float barTop = h - pad - bh;
              cv.drawRoundRect(new RectF(pad, barTop, colR, barTop + bh), bh / 2f, bh / 2f, BunnyWidget.fill(p.track));
              float f = Math.min(1f, water / (float) goal);
              if (f > 0f) {
                float fw = Math.max(bh, (colR - pad) * f);
                cv.drawRoundRect(new RectF(pad, barTop, pad + fw, barTop + bh), bh / 2f, bh / 2f, BunnyWidget.fill(p.pr));
              }
              float zt = 12f * u;
              float z = (h - 2 * zt) / 3f;
              float bhh = z - 6f * u;
              String[] lbs = {"+200", "+300", "+500"};
              for (int i = 0; i < 3; i++) {
                float cy = zt + z * i + z / 2f;
                RectF r = new RectF(w - pad - 92f * u, cy - bhh / 2f, w - pad, cy + bhh / 2f);
                cv.drawRoundRect(r, bhh / 2f, bhh / 2f, BunnyWidget.fill(p.sc));
                Paint tl = tp(tf, p.onSc, 14f * u, true);
                tl.setTextAlign(Paint.Align.CENTER);
                cv.drawText(lbs[i], r.centerX(), cy + BunnyWidget.mid(tl), tl);
              }
            }
          }
