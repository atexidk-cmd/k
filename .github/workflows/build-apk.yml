name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore signing key
        id: ks
        uses: actions/cache@v4
        with:
          path: android.keystore
          key: bunny-keystore-v1
      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli
      - name: Fix SDK layout
        run: |
          mkdir -p $ANDROID_HOME/tools
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Make signing key
        if: steps.ks.outputs.cache-hit != 'true'
        run: keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass bunny123456 -keypass bunny123456 -dname "CN=Bunny"
      - name: Show fingerprint
        run: keytool -list -v -keystore android.keystore -storepass bunny123456 | grep SHA256
      - name: Generate project
        run: bubblewrap update --skipVersionUpgrade
      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: bunny123456
          BUBBLEWRAP_KEY_PASSWORD: bunny123456
        run: bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: bunny-apk
          path: '*.apk'
