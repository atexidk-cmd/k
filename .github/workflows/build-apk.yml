name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Show SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
      - name: Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Make signing key
        run: keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass bunny123456 -keypass bunny123456 -dname "CN=Bunny"
      - name: Generate project
        run: bubblewrap update --skipVersionUpgrade
      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: bunny123456
          BUBBLEWRAP_KEY_PASSWORD: bunny123456
        run: bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: bunny-apk
          path: app-release-signed.apk
