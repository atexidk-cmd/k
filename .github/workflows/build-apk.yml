          addw(){ grep -q "name=\".BunnyWidget$1\"" $M || sed -i "s#</application>#    <receiver android:name=\".BunnyWidget$1\" android:exported=\"true\" android:label=\"$2\">\n      <intent-filter>\n        <action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" />\n      </intent-filter>\n      <meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/bunny_widget_$3_info\" />\n    </receiver>\n  </application>#" $M; }
          addw Next "BunnyBuddy up next" next
          addw Mood "BunnyBuddy mood" mood
          addw Week "BunnyBuddy week" week
          addw Meals "BunnyBuddy meals" meals
          addw Partner "BunnyBuddy partner" partner
          addw WaterQuick "BunnyBuddy water quick add" wq
          addw ClockMe "BunnyBuddy my clock" clock_me
          addw ClockThem "BunnyBuddy their clock" clock_them
          grep -q 'name=".BunnyWidgetAct"' $M || sed -i 's#</application>#    <receiver android:name=".BunnyWidgetAct" android:exported="false" />\n  </application>#' $M
          grep -n "BunnyWidget" $M
          # widget font: Bricolage Grotesque (same as the app). Drop bricolage.ttf in the repo root to use your own copy, otherwise it is downloaded here
          mkdir -p $R/font
          FONT_OK=0
          if [ -f BricolageGrotesque-Bold.otf ]; then cp BricolageGrotesque-Bold.otf $R/font/google_sans.otf && FONT_OK=1 && echo "widget font: BricolageGrotesque-Bold.otf from repo"
          elif [ -f bricolage.ttf ]; then cp bricolage.ttf $R/font/google_sans.ttf && FONT_OK=1 && echo "widget font: bricolage.ttf from repo"
          elif curl -fsSL --retry 3 -o bricolage-dl.ttf "https://github.com/google/fonts/raw/main/ofl/bricolagegrotesque/BricolageGrotesque%5Bopsz%2Cwdth%2Cwght%5D.ttf" && [ "$(stat -c%s bricolage-dl.ttf)" -gt 50000 ]; then cp bricolage-dl.ttf $R/font/google_sans.ttf && FONT_OK=1 && echo "widget font: Bricolage Grotesque downloaded"
          else echo "widget font: Bricolage not available, using the phone system font"; fi
          if [ "$FONT_OK" = 1 ]; then sed -i "s|android:textStyle=\"bold\"|android:fontFamily=\"@font/google_sans\" android:fontVariationSettings=\"'wght' 800, 'opsz' 48\" android:textStyle=\"normal\"|" $R/layout/widget_clock.xml; else rmdir $R/font 2>/dev/null || true; fi
          npx cap sync android
      - name: Set app address
        run: |
          echo '{"appId":"io.github.atexidk.bunnyapp","appName":"BunnyBuddy","webDir":"www","server":{"hostname":"atexidk-cmd.github.io","androidScheme":"https","allowNavigation":["bunnybuddy-6622c.firebaseapp.com","accounts.google.com","*.google.com","*.googleapis.com","*.gstatic.com"]},"plugins":{"LocalNotifications":{"smallIcon":"ic_stat_bunny","iconColor":"#5A7A00"}}}' > capacitor.config.json
          npx cap copy android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - name: Show APK fingerprint
        run: $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-1|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: bunny-native
          path: android/app/build/outputs/apk/debug/app-debug.apk
