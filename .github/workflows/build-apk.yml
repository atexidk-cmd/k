name: Build Native APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore signing key
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in bunny.keystore.enc -out $HOME/bunny.keystore -pass env:KS_PASS
          echo "BUNNY_KS=$HOME/bunny.keystore" >> $GITHUB_ENV
          keytool -list -v -keystore $HOME/bunny.keystore -storepass android | grep -E "SHA1|SHA256"
      - name: Make app
        run: |
          sudo apt-get install -y imagemagick > /dev/null
          mkdir www
          cp index.html sw.js manifest.json icon-192.png icon-512.png extra.css rescue.js www/
          cat > www/native.js <<'JSEOF'
          (function(){
          var C=window.Capacitor;
          if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
          function inset(){try{var a=String(window.BunnyNative.insets()).split(","),st=document.documentElement.style;st.setProperty("--sat",a[0]+"px");st.setProperty("--sab",a[1]+"px");st.setProperty("--sal",a[2]+"px");st.setProperty("--sar",a[3]+"px")}catch(e){}}
          function bars(){try{window.BunnyNative.light(document.documentElement.dataset.theme!=="dark")}catch(e){}}
          inset();bars();
          [200,600,1500,3000].forEach(function(ms){setTimeout(function(){inset();bars()},ms)});
          window.addEventListener("resize",inset);
          try{new MutationObserver(bars).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}
          try{if(window.BunnyNative&&window.BunnyNative.vibrate){navigator.vibrate=function(p){try{window.BunnyNative.vibrate(Array.isArray(p)?p.join(","):String(p))}catch(e){}return true}}}catch(e){}
          function gcred(){return new Promise(function(res,rej){window.__gsDone=function(tok,err){if(tok){try{res(firebase.auth.GoogleAuthProvider.credential(tok))}catch(e){rej(e)}}else{rej({code:err==="cancelled"?"auth/popup-closed-by-user":"auth/internal-error",message:String(err)})}};try{window.BunnyNative.googleSignIn()}catch(e){rej({code:"auth/internal-error",message:"native"})}})}
          function gpatch(){
          var fb=window.firebase;
          if(!fb||!fb.apps||!fb.apps.length||!fb.auth)return false;
          var a=fb.auth();
          if(a.__bn)return true;
          a.__bn=1;
          a.signInWithPopup=function(){return gcred().then(function(c){return a.signInWithCredential(c)})};
          function pu(u){if(!u||u.__bn)return;u.__bn=1;u.linkWithPopup=function(){return gcred().then(function(c){return u.linkWithCredential(c)})}}
          pu(a.currentUser);
          a.onAuthStateChanged(pu);
          return true}
          var gt=setInterval(function(){try{if(gpatch())clearInterval(gt)}catch(e){}},300);
          setTimeout(function(){clearInterval(gt)},120000);
          var LN=C.Plugins&&C.Plugins.LocalNotifications;
          if(!LN)return;
          function N(){}
          N.permission="default";
          N.requestPermission=function(){return LN.requestPermissions().then(function(r){N.permission=r.display==="granted"?"granted":"denied";return N.permission})};
          window.Notification=N;
          LN.checkPermissions().then(function(r){if(r.display==="granted")N.permission="granted"}).catch(function(){});
          function prof(){try{return JSON.parse(localStorage.getItem("bunnyPlannerProfile_v1")||"{}")||{}}catch(e){return{}}}
          function mins(s){var a=String(s||"").split(":");return(+a[0]||0)*60+(+a[1]||0)}
          function inQuiet(t,q){if(!q||!q.on)return false;var f=mins(q.from),e=mins(q.to);t=t%1440;return f<=e?(t>=f&&t<e):(t>=f||t<e)}
          function slots(p){var m=mins(p.remMorning||"08:00"),n=mins(p.remNight||"21:30"),s={light:240,normal:180,often:120}[p.remFreq]||180,a=[m],t=m+s;while(t<n-60){a.push(t);t+=s}if(n>m)a.push(n);return a}
          function sync(){
          var p=prof();
          return LN.createChannel({id:"bunny",name:"Check-ins",importance:4}).catch(function(){}).then(function(){return LN.getPending()}).then(function(r){
          var old=(r&&r.notifications)||[];
          return old.length?LN.cancel({notifications:old}):0}).then(function(){
          if(!p.remindersOn)return;
          var sl=slots(p),list=[],now=Date.now(),d,i;
          for(d=0;d<7;d++){for(i=0;i<sl.length;i++){
          if(inQuiet(sl[i],p.quiet))continue;
          var at=new Date();at.setHours(0,0,0,0);at.setDate(at.getDate()+d);at.setMinutes(sl[i]);
          if(at.getTime()<now+10000)continue;
          var body=i===0?"Good morning! Ready for today's routines?":(i===sl.length-1?"Bedtime soon. Wind down and tick off your day.":"Quick check-in: how are your routines going?");
          list.push({id:d*100+i+1,title:"Bunny",body:body,channelId:"bunny",schedule:{at:at,allowWhileIdle:true}})}}
          return list.length?LN.schedule({notifications:list}):0})}
          window.addEventListener("load",function(){
          var Cl=window.__Cloud;
          if(Cl){
          Cl.enableReminders=function(test){return LN.requestPermissions().then(function(r){if(r.display!=="granted"){N.permission="denied";throw{code:"DENIED"}}N.permission="granted";return sync()}).then(function(){if(test)return LN.schedule({notifications:[{id:99999,title:"Bunny",body:"Nudges are on!",channelId:"bunny",schedule:{at:new Date(Date.now()+2000),allowWhileIdle:true}}]})})};
          Cl.resyncReminders=function(){return sync().catch(function(){})};
          Cl.disableReminders=function(){return sync().catch(function(){})};
          }
          var t;window.__remSync=function(){clearTimeout(t);t=setTimeout(function(){sync().catch(function(){})},1500)};
          sync().catch(function(){});
          });
          })();
          JSEOF
          sed -i 's|<head>|<head><script src="native.js"></script>|' www/index.html
          sed -i 's|</head>|<link rel="stylesheet" href="extra.css"></head>|' www/index.html
          sed -i 's/env(safe-area-inset-top)/var(--sat,env(safe-area-inset-top))/g; s/env(safe-area-inset-bottom)/var(--sab,env(safe-area-inset-bottom))/g; s/env(safe-area-inset-left)/var(--sal,env(safe-area-inset-left))/g; s/env(safe-area-inset-right)/var(--sar,env(safe-area-inset-right))/g' www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/share@6 @capacitor/filesystem@6
          echo '{"appId":"io.github.atexidk.bunnyapp","appName":"BunnyBuddy","webDir":"www","plugins":{"LocalNotifications":{"smallIcon":"ic_stat_bunny","iconColor":"#5A7A00"}}}' > capacitor.config.json
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.VIBRATE" $M || sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' $M
          grep -n "VIBRATE" $M
          for P in 'android.permission.RECORD_AUDIO' 'android.permission.MODIFY_AUDIO_SETTINGS'; do
            grep -q "$P" $M || sed -i "s#<application#<uses-permission android:name=\"$P\" />\n    <application#" $M
          done
          grep -q "WRITE_EXTERNAL_STORAGE" $M || sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application#' $M
          grep -q "READ_EXTERNAL_STORAGE" $M || sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application#' $M
          for P in 'android.permission.READ_MEDIA_IMAGES' 'android.permission.READ_MEDIA_VIDEO' 'android.permission.READ_MEDIA_AUDIO' 'android.permission.READ_MEDIA_VISUAL_USER_SELECTED'; do
            grep -q "$P" $M || sed -i "s#<application#<uses-permission android:name=\"$P\" />\n    <application#" $M
          done
          grep -n "uses-permission" $M
          grep -q "android:largeHeap" $M || sed -i 's#<application#<application android:largeHeap="true" android:hardwareAccelerated="true"#' $M
          grep -n "largeHeap" $M
          grep -q 'name=".BunnyWidget"' $M || sed -i 's#</application>#    <receiver android:name=".BunnyWidget" android:exported="true" android:label="BunnyBuddy today">\n      <intent-filter>\n        <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n        <action android:name="android.intent.action.DATE_CHANGED" />\n        <action android:name="android.intent.action.TIME_SET" />\n        <action android:name="android.intent.action.TIMEZONE_CHANGED" />\n      </intent-filter>\n      <meta-data android:name="android.appwidget.provider" android:resource="@xml/bunny_widget_info" />\n    </receiver>\n  </application>#' $M
          grep -q 'name=".BunnyWidgetSmall"' $M || sed -i 's#</application>#    <receiver android:name=".BunnyWidgetSmall" android:exported="true" android:label="BunnyBuddy routines">\n      <intent-filter>\n        <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n      </intent-filter>\n      <meta-data android:name="android.appwidget.provider" android:resource="@xml/bunny_widget_small_info" />\n    </receiver>\n  </application>#' $M
          grep -q 'name=".BunnyWidgetWater"' $M || sed -i 's#</application>#    <receiver android:name=".BunnyWidgetWater" android:exported="true" android:label="BunnyBuddy water">\n      <intent-filter>\n        <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n      </intent-filter>\n      <meta-data android:name="android.appwidget.provider" android:resource="@xml/bunny_widget_water_info" />\n    </receiver>\n  </application>#' $M
          grep -n "BunnyWidget" $M
          cat >> android/app/build.gradle <<'GRADLEEOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("BUNNY_KS"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-auth:21.2.0'
          }
          GRADLEEOF
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          find $R -name 'ic_launcher_foreground.*' -delete
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            mkdir -p $R/mipmap-$d
            rm -f $R/mipmap-$d/ic_launcher.* $R/mipmap-$d/ic_launcher_round.*
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
          done
          mkdir -p $R/drawable
          cat > $R/drawable/ic_stat_bunny.xml <<'XMLEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF" android:pathData="M6.7,6 a1.8,4.5 0 1,0 3.6,0 a1.8,4.5 0 1,0 -3.6,0 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M13.7,6 a1.8,4.5 0 1,0 3.6,0 a1.8,4.5 0 1,0 -3.6,0 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M5.5,15 a6.5,6.5 0 1,0 13,0 a6.5,6.5 0 1,0 -13,0 Z"/>
          </vector>
          XMLEOF
          cat > android/app/src/main/java/io/github/atexidk/bunnyapp/MainActivity.java <<'JAVAEOF'
          package io.github.atexidk.bunnyapp;

          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import com.google.android.gms.auth.api.signin.GoogleSignIn;
          import com.google.android.gms.auth.api.signin.GoogleSignInAccount;
          import com.google.android.gms.auth.api.signin.GoogleSignInClient;
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions;
          import com.google.android.gms.common.api.ApiException;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            private volatile String insetsStr = "0,0,0,0";
            private static final int GS_CODE = 9001;
            private static final String WEB_CLIENT_ID = "826013636032-tco3cfideg8msh1ae6secbt50lcr6ar3.apps.googleusercontent.com";

            public class BunnyBridge {
              @JavascriptInterface
              public String takePending() {
                return BunnyWidgetMore.takePending(MainActivity.this.getApplicationContext());
              }

              @JavascriptInterface
              public String insets() { return insetsStr; }

              @JavascriptInterface
              public void vibrate(String pattern) {
                try {
                  String[] s = pattern.split(",");
                  long[] p = new long[s.length + 1];
                  p[0] = 0;
                  for (int i = 0; i < s.length; i++) {
                    p[i + 1] = Math.max(0L, (long) Double.parseDouble(s[i].trim()));
                  }
                  Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                  if (v == null || !v.hasVibrator()) return;
                  if (Build.VERSION.SDK_INT >= 26) {
                    v.vibrate(VibrationEffect.createWaveform(p, -1));
                  } else {
                    v.vibrate(p, -1);
                  }
                } catch (Exception e) {
                }
              }

              @JavascriptInterface
              public void light(final boolean l) {
                runOnUiThread(new Runnable() {
                  public void run() {
                    Window w = getWindow();
                    WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                    c.setAppearanceLightStatusBars(l);
                    c.setAppearanceLightNavigationBars(l);
                  }
                });
              }

              @JavascriptInterface
              public void exit() {
                runOnUiThread(new Runnable() {
                  public void run() {
                    moveTaskToBack(true);
                  }
                });
              }

              @JavascriptInterface
              public void widget(String json) {
                try {
                  getSharedPreferences("bunny_widget", MODE_PRIVATE).edit().putString("json", json).apply();
                  BunnyWidget.refresh(MainActivity.this.getApplicationContext());
                } catch (Exception e) {
                }
              }

              @JavascriptInterface
              public void googleSignIn() {
                runOnUiThread(new Runnable() {
                  public void run() {
                    try {
                      GoogleSignInOptions gso = new GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                        .requestIdToken(WEB_CLIENT_ID)
                        .requestEmail()
                        .build();
                      final GoogleSignInClient gc = GoogleSignIn.getClient(MainActivity.this, gso);
                      gc.signOut().addOnCompleteListener(t -> MainActivity.this.startActivityForResult(gc.getSignInIntent(), GS_CODE));
                    } catch (Exception e) {
                      deliver(null, "error");
                    }
                  }
                });
              }
            }

            private void deliver(final String tok, final String err) {
              runOnUiThread(new Runnable() {
                public void run() {
                  String js = "window.__gsDone&&window.__gsDone(" + (tok == null ? "null" : JSONObject.quote(tok)) + "," + (err == null ? "null" : JSONObject.quote(err)) + ")";
                  getBridge().getWebView().evaluateJavascript(js, null);
                }
              });
            }

            @Override
            public void onActivityResult(int req, int res, Intent data) {
              super.onActivityResult(req, res, data);
              if (req == GS_CODE) {
                try {
                  GoogleSignInAccount a = GoogleSignIn.getSignedInAccountFromIntent(data).getResult(ApiException.class);
                  deliver(a.getIdToken(), null);
                } catch (ApiException e) {
                  deliver(null, e.getStatusCode() == 12501 ? "cancelled" : "code" + e.getStatusCode());
                }
              }
            }

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              Window w = getWindow();
              WindowCompat.setDecorFitsSystemWindows(w, false);
              w.setStatusBarColor(Color.TRANSPARENT);
              w.setNavigationBarColor(Color.TRANSPARENT);
              if (Build.VERSION.SDK_INT >= 29) {
                w.setNavigationBarContrastEnforced(false);
              }
              if (Build.VERSION.SDK_INT >= 28) {
                w.getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              View root = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                Insets sb = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                float d = getResources().getDisplayMetrics().density;
                insetsStr = Math.round(sb.top / d) + "," + Math.round(sb.bottom / d) + "," + Math.round(sb.left / d) + "," + Math.round(sb.right / d);
                v.setPadding(0, 0, 0, ime.bottom > sb.bottom ? ime.bottom : 0);
                return insets;
              });
              getBridge().getWebView().addJavascriptInterface(new BunnyBridge(), "BunnyNative");
              tune();
              widgetTab(getIntent());
            }

            @Override
            public void onResume() {
              super.onResume();
              try {
                getBridge().getWebView().postDelayed(new Runnable() {
                  public void run() {
                    try {
                      getBridge().getWebView().evaluateJavascript("window.__wgFlush&&window.__wgFlush()", null);
                    } catch (Exception e) {
                    }
                  }
                }, 400L);
              } catch (Exception e) {
              }
            }

            private void widgetTab(Intent i) {
              if (i == null) return;
              final String t = i.getStringExtra("tab");
              if (t == null) return;
              i.removeExtra("tab");
              final String js = "window.__wgTab&&window.__wgTab(" + JSONObject.quote(t) + "," + System.currentTimeMillis() + ")";
              for (int k = 0; k < 6; k++) {
                getBridge().getWebView().postDelayed(new Runnable() {
                  public void run() {
                    getBridge().getWebView().evaluateJavascript(js, null);
                  }
                }, 500L * k * k);
              }
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              widgetTab(intent);
            }

            private void tune() {
              try {
                if (Build.VERSION.SDK_INT >= 26) {
                  getBridge().getWebView().setRendererPriorityPolicy(android.webkit.WebView.RENDERER_PRIORITY_IMPORTANT, false);
                }
              } catch (Exception e) {
              }
              try {
                if (Build.VERSION.SDK_INT >= 23) {
                  android.view.Display d = getWindowManager().getDefaultDisplay();
                  android.view.Display.Mode cur = d.getMode();
                  android.view.Display.Mode best = cur;
                  for (android.view.Display.Mode m : d.getSupportedModes()) {
                    if (m.getPhysicalWidth() == cur.getPhysicalWidth() && m.getPhysicalHeight() == cur.getPhysicalHeight() && m.getRefreshRate() > best.getRefreshRate() + 1f) {
                      best = m;
                    }
                  }
                  if (best.getModeId() != cur.getModeId()) {
                    WindowManager.LayoutParams lp = getWindow().getAttributes();
                    lp.preferredDisplayModeId = best.getModeId();
                    getWindow().setAttributes(lp);
                  }
                }
              } catch (Exception e) {
              }
            }
          }
          JAVAEOF
          # ---- home-screen widgets (Material You style, drawn as bitmaps) ----
          PK=android/app/src/main/java/io/github/atexidk/bunnyapp
          mkdir -p $R/layout $R/xml $R/drawable
          cat > $PK/BunnyWidget.java <<'WJAVAEOF'
          package io.github.atexidk.bunnyapp;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.RemoteViews;
          import androidx.core.content.res.ResourcesCompat;
          import androidx.core.graphics.ColorUtils;
          import java.text.NumberFormat;
          import java.util.Calendar;
          import java.util.Locale;
          import org.json.JSONObject;

          public class BunnyWidget extends AppWidgetProvider {
            static final String PREFS = "bunny_widget";
            static final int TODAY = 0, ROUTINES = 1, WATER = 2;

            static class Data {
              int done, total, streak, water, goal = 2000, pct;
              int accent = 0xFFC6E852;
              boolean dark, fresh;
            }

            static class Pal {
              int bg, on, sub, track, pr, pc, onPc, sc, onSc, tc, onTc;
            }

            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
              for (int id : ids) {
                update(c, m, id, TODAY);
              }
            }

            @Override
            public void onAppWidgetOptionsChanged(Context c, AppWidgetManager m, int id, Bundle o) {
              update(c, m, id, TODAY);
            }

            @Override
            public void onReceive(Context c, Intent i) {
              super.onReceive(c, i);
              String a = i == null ? null : i.getAction();
              if (Intent.ACTION_DATE_CHANGED.equals(a) || Intent.ACTION_TIME_CHANGED.equals(a) || Intent.ACTION_TIMEZONE_CHANGED.equals(a)) {
                refresh(c);
              }
            }

            public static void refresh(Context c) {
              try {
                AppWidgetManager m = AppWidgetManager.getInstance(c);
                Class[] kinds = new Class[] {BunnyWidget.class, BunnyWidgetSmall.class, BunnyWidgetWater.class, BunnyWidgetNext.class, BunnyWidgetMood.class, BunnyWidgetWeek.class, BunnyWidgetMeals.class, BunnyWidgetPartner.class, BunnyWidgetWaterQuick.class, BunnyWidgetClockMe.class, BunnyWidgetClockThem.class};
                for (int k = 0; k < kinds.length; k++) {
                  int[] ids = m.getAppWidgetIds(new ComponentName(c, kinds[k]));
                  if (ids == null) continue;
                  for (int id : ids) {
                    update(c, m, id, k);
                  }
                }
              } catch (Exception e) {
              }
            }

            static void update(Context c, AppWidgetManager m, int id, int kind) {
              try {
                m.updateAppWidget(id, build(c, m, id, kind));
              } catch (Throwable t) {
              }
            }

            static String today() {
              Calendar k = Calendar.getInstance();
              return k.get(Calendar.YEAR) + "-" + (k.get(Calendar.MONTH) + 1) + "-" + k.get(Calendar.DAY_OF_MONTH);
            }

            static String nf(int n) {
              return NumberFormat.getIntegerInstance(Locale.US).format(n);
            }

            static Data load(Context c) {
              Data d = new Data();
              try {
                String raw = c.getSharedPreferences(PREFS, 0).getString("json", null);
                if (raw != null) {
                  JSONObject j = new JSONObject(raw);
                  d.done = j.optInt("done");
                  d.total = j.optInt("total");
                  d.streak = j.optInt("streak");
                  d.water = j.optInt("water");
                  d.goal = j.optInt("goal", 2000);
                  String a = j.optString("accent", "");
                  if (a.startsWith("#")) d.accent = Color.parseColor(a);
                  d.dark = j.optBoolean("dark", false);
                  d.fresh = today().equals(j.optString("day"));
                }
              } catch (Exception e) {
              }
              if (!d.fresh) {
                d.done = 0;
                d.water = 0;
              }
              if (d.goal <= 0) d.goal = 2000;
              d.pct = d.total > 0 ? Math.min(100, Math.round(d.done * 100f / d.total)) : 0;
              return d;
            }

            static int tone(int seed, float hue, float s, float l) {
              float[] h = new float[3];
              ColorUtils.colorToHSL(seed, h);
              h[0] = (h[0] + hue + 360f) % 360f;
              h[1] = Math.max(0.10f, Math.min(0.95f, h[1] * s));
              h[2] = l;
              return ColorUtils.HSLToColor(h);
            }

            static Pal pal(int seed, boolean dark) {
              Pal p = new Pal();
              if (dark) {
                p.bg = tone(seed, 0f, 0.30f, 0.13f);
                p.on = tone(seed, 0f, 0.20f, 0.92f);
                p.sub = tone(seed, 0f, 0.25f, 0.72f);
                p.track = tone(seed, 0f, 0.35f, 0.27f);
                p.pr = tone(seed, 0f, 1.00f, 0.72f);
                p.pc = tone(seed, 0f, 0.55f, 0.32f);
                p.onPc = tone(seed, 0f, 0.40f, 0.90f);
                p.sc = tone(seed, 40f, 0.40f, 0.28f);
                p.onSc = tone(seed, 40f, 0.30f, 0.90f);
                p.tc = tone(seed, -55f, 0.50f, 0.30f);
                p.onTc = tone(seed, -55f, 0.30f, 0.90f);
              } else {
                p.bg = tone(seed, 0f, 0.50f, 0.93f);
                p.on = tone(seed, 0f, 0.40f, 0.10f);
                p.sub = tone(seed, 0f, 0.30f, 0.33f);
                p.track = tone(seed, 0f, 0.60f, 0.84f);
                p.pr = tone(seed, 0f, 1.00f, 0.30f);
                p.pc = tone(seed, 0f, 1.00f, 0.78f);
                p.onPc = tone(seed, 0f, 0.60f, 0.12f);
                p.sc = tone(seed, 40f, 0.70f, 0.84f);
                p.onSc = tone(seed, 40f, 0.50f, 0.12f);
                p.tc = tone(seed, -55f, 0.80f, 0.82f);
                p.onTc = tone(seed, -55f, 0.50f, 0.12f);
              }
              return p;
            }

            static int sysc(Context c, int res) {
              return androidx.core.content.ContextCompat.getColor(c, res);
            }

            /* Material You: on Android 12+ take every colour from the phone's wallpaper palette and follow the system light/dark mode */
            static Pal palFor(Context c, int seed, boolean dark) {
              if (Build.VERSION.SDK_INT < 31) return pal(seed, dark);
              try {
                int ui = c.getResources().getConfiguration().uiMode & android.content.res.Configuration.UI_MODE_NIGHT_MASK;
                boolean n = ui == android.content.res.Configuration.UI_MODE_NIGHT_YES;
                Pal p = new Pal();
                if (n) {
                  p.bg = sysc(c, android.R.color.system_neutral1_900);
                  p.on = sysc(c, android.R.color.system_neutral1_100);
                  p.sub = sysc(c, android.R.color.system_neutral2_200);
                  p.track = sysc(c, android.R.color.system_neutral2_700);
                  p.pr = sysc(c, android.R.color.system_accent1_200);
                  p.pc = sysc(c, android.R.color.system_accent1_700);
                  p.onPc = sysc(c, android.R.color.system_accent1_100);
                  p.sc = sysc(c, android.R.color.system_accent2_700);
                  p.onSc = sysc(c, android.R.color.system_accent2_100);
                  p.tc = sysc(c, android.R.color.system_accent3_700);
                  p.onTc = sysc(c, android.R.color.system_accent3_100);
                } else {
                  p.bg = sysc(c, android.R.color.system_neutral1_50);
                  p.on = sysc(c, android.R.color.system_neutral1_900);
                  p.sub = sysc(c, android.R.color.system_neutral2_700);
                  p.track = sysc(c, android.R.color.system_neutral2_200);
                  p.pr = sysc(c, android.R.color.system_accent1_600);
                  p.pc = sysc(c, android.R.color.system_accent1_100);
                  p.onPc = sysc(c, android.R.color.system_accent1_900);
                  p.sc = sysc(c, android.R.color.system_accent2_100);
                  p.onSc = sysc(c, android.R.color.system_accent2_900);
                  p.tc = sysc(c, android.R.color.system_accent3_100);
                  p.onTc = sysc(c, android.R.color.system_accent3_900);
                }
                return p;
              } catch (Throwable t) {
                return pal(seed, dark);
              }
            }

            static PendingIntent open(Context c, String tab, int code) {
              Intent it = new Intent(c, MainActivity.class);
              it.setData(Uri.parse("bunny://widget/" + tab + "/" + code));
              it.putExtra("tab", tab);
              it.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              return PendingIntent.getActivity(c, code, it, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }

            static Typeface base(Context c) {
              try {
                int id = c.getResources().getIdentifier("google_sans", "font", c.getPackageName());
                if (id != 0) {
                  Typeface t = ResourcesCompat.getFont(c, id);
                  if (t != null) return t;
                }
              } catch (Exception e) {
              }
              return null;
            }

            static Paint tp(Typeface base, int color, float size, boolean bold) {
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              p.setColor(color);
              p.setTextSize(size);
              if (base != null) {
                p.setTypeface(base);
                if (Build.VERSION.SDK_INT >= 26) {
                  try {
                    p.setFontVariationSettings(bold ? "'wght' 800, 'opsz' 36" : "'wght' 600, 'opsz' 36");
                  } catch (Exception e) {
                  }
                }
              } else {
                p.setTypeface(Typeface.create("google-sans", bold ? Typeface.BOLD : Typeface.NORMAL));
              }
              return p;
            }

            static Paint fill(int color) {
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              p.setColor(color);
              return p;
            }

            static void fit(Paint p, String s, float maxW, float size) {
              p.setTextSize(size);
              float w = p.measureText(s);
              if (w > maxW && w > 0) p.setTextSize(size * maxW / w);
            }

            static float mid(Paint p) {
              return -(p.ascent() + p.descent()) / 2f;
            }

            static void cookie(Canvas cv, float cx, float cy, float r, Paint p) {
              Path path = new Path();
              int n = 180;
              for (int i = 0; i <= n; i++) {
                double a = i * 2 * Math.PI / n;
                double rr = r * (0.93 + 0.07 * Math.cos(8 * a));
                float x = (float) (cx + rr * Math.cos(a));
                float y = (float) (cy + rr * Math.sin(a));
                if (i == 0) path.moveTo(x, y);
                else path.lineTo(x, y);
              }
              path.close();
              cv.drawPath(path, p);
            }

            static String describe(Data d) {
              return d.done + " of " + d.total + " routines done, " + d.streak + " day streak, " + nf(d.water) + " of " + nf(d.goal) + " millilitres of water";
            }

            static RemoteViews build(Context c, AppWidgetManager m, int id, int kind) {
              if (kind >= 3) return BunnyWidgetMore.build(c, m, id, kind);
              float dn = c.getResources().getDisplayMetrics().density;
              Bundle o = m.getAppWidgetOptions(id);
              int wdp = o == null ? 0 : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0);
              int hdp = o == null ? 0 : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0);
              if (wdp <= 0) wdp = kind == TODAY ? 250 : 110;
              if (hdp <= 0) hdp = 110;
              int w = Math.round(wdp * dn);
              int h = Math.round(hdp * dn);
              float budget = 1400000f / ((float) w * (float) h);
              if (budget < 1f) {
                float k = (float) Math.sqrt(budget);
                w = Math.round(w * k);
                h = Math.round(h * k);
              }
              Data d = load(c);
              Pal p = palFor(c, d.accent, d.dark);
              Typeface tf = base(c);
              Bitmap b = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
              Canvas cv = new Canvas(b);
              if (kind == TODAY) drawToday(cv, w, h, d, p, tf);
              else if (kind == ROUTINES) drawRoutines(cv, w, h, d, p, tf);
              else drawWater(cv, w, h, d, p, tf);
              RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_bunny);
              v.setImageViewBitmap(R.id.img, b);
              v.setContentDescription(R.id.img, describe(d));
              if (kind == TODAY) {
                v.setOnClickPendingIntent(R.id.tapL, open(c, "home", 10));
                v.setOnClickPendingIntent(R.id.tapR, open(c, "routines", 11));
              } else if (kind == ROUTINES) {
                v.setOnClickPendingIntent(R.id.tapL, open(c, "home", 12));
                v.setOnClickPendingIntent(R.id.tapR, open(c, "home", 13));
              } else {
                v.setOnClickPendingIntent(R.id.tapL, open(c, "routines", 14));
                v.setOnClickPendingIntent(R.id.tapR, open(c, "routines", 15));
              }
              return v;
            }

            static void chip(Canvas cv, String t, float x, float top, float ch, int bg, int fg, Typeface tf, float cs, float px, float maxW) {
              Paint c = tp(tf, fg, cs, true);
              float wd = c.measureText(t) + 2 * px;
              if (wd > maxW) {
                float k = maxW / wd;
                c.setTextSize(cs * k);
                px = px * k;
                wd = maxW;
              }
              cv.drawRoundRect(new RectF(x, top, x + wd, top + ch), ch / 2f, ch / 2f, fill(bg));
              cv.drawText(t, x + px, top + ch / 2f + mid(c), c);
            }

            static void drawToday(Canvas cv, int w, int h, Data d, Pal p, Typeface tf) {
              float r = 0.26f * h;
              cv.drawRoundRect(new RectF(0, 0, w, h), r, r, fill(p.bg));
              float pad = 0.11f * h;
              float dia = h - 2 * pad;
              float cx = pad + dia / 2f;
              float cy = h / 2f;
              cookie(cv, cx, cy, dia / 2f, fill(p.pc));
              String pc = d.pct + "%";
              Paint tn = tp(tf, p.onPc, 0.34f * dia, true);
              fit(tn, pc, dia * 0.62f, 0.34f * dia);
              tn.setTextAlign(Paint.Align.CENTER);
              cv.drawText(pc, cx, cy + mid(tn), tn);
              float x0 = pad + dia + 0.10f * h;
              float maxW = w - pad - x0;
              Paint lab = tp(tf, p.sub, 0.105f * h, true);
              cv.drawText("Today", x0, 0.21f * h, lab);
              String head = d.fresh ? d.done + " of " + d.total : "Tap to start";
              Paint hp = tp(tf, p.on, 0.19f * h, true);
              fit(hp, head, maxW, 0.19f * h);
              cv.drawText(head, x0, 0.44f * h, hp);
              if (d.fresh) {
                Paint sp = tp(tf, p.sub, 0.105f * h, false);
                float hx = x0 + hp.measureText(head) + 0.05f * h;
                if (hx + sp.measureText("routines") <= w - pad) cv.drawText("routines", hx, 0.44f * h, sp);
              }
              String t1 = d.streak > 0 ? d.streak + " day streak" : "No streak yet";
              String t2 = nf(d.water) + " ml water";
              float ch = 0.18f * h;
              chip(cv, t1, x0, 0.53f * h, ch, p.tc, p.onTc, tf, 0.105f * h, 0.08f * h, maxW);
              chip(cv, t2, x0, 0.74f * h, ch, p.sc, p.onSc, tf, 0.105f * h, 0.08f * h, maxW);
            }

            static void drawRoutines(Canvas cv, int w, int h, Data d, Pal p, Typeface tf) {
              float m = Math.min(w, h);
              float r = 0.26f * m;
              cv.drawRoundRect(new RectF(0, 0, w, h), r, r, fill(p.bg));
              float pad = 0.10f * m;
              float stroke = 0.17f * m;
              float rad = m / 2f - pad - stroke / 2f;
              float cx = w / 2f;
              float cy = h / 2f;
              RectF rc = new RectF(cx - rad, cy - rad, cx + rad, cy + rad);
              Paint q = new Paint(Paint.ANTI_ALIAS_FLAG);
              q.setStyle(Paint.Style.STROKE);
              q.setStrokeWidth(stroke);
              q.setStrokeCap(Paint.Cap.ROUND);
              q.setColor(p.track);
              cv.drawArc(rc, 0f, 360f, false, q);
              if (d.pct > 0) {
                q.setColor(p.pr);
                cv.drawArc(rc, -90f, Math.min(360f, d.pct * 3.6f), false, q);
              }
              String big = d.done + "/" + d.total;
              Paint bp = tp(tf, p.on, 0.25f * m, true);
              fit(bp, big, (rad - stroke / 2f) * 1.6f, 0.25f * m);
              bp.setTextAlign(Paint.Align.CENTER);
              float by = cy + mid(bp) - 0.035f * m;
              cv.drawText(big, cx, by, bp);
              Paint lp = tp(tf, p.sub, 0.075f * m, false);
              lp.setTextAlign(Paint.Align.CENTER);
              cv.drawText("routines", cx, by + 0.115f * m, lp);
            }

            static void drawWater(Canvas cv, int w, int h, Data d, Pal p, Typeface tf) {
              float r = 0.26f * Math.min(w, h);
              cv.drawRoundRect(new RectF(0, 0, w, h), r, r, fill(p.bg));
              float pad = 0.11f * h;
              float bh = 0.20f * h;
              float bw = w - 2 * pad;
              cv.drawRoundRect(new RectF(pad, pad, pad + bw, pad + bh), bh / 2f, bh / 2f, fill(p.track));
              float f = Math.min(1f, d.water / (float) d.goal);
              if (f > 0f) {
                float fw = Math.max(bh, bw * f);
                cv.drawRoundRect(new RectF(pad, pad, pad + fw, pad + bh), bh / 2f, bh / 2f, fill(p.pr));
              }
              String big = nf(d.water);
              Paint bp = tp(tf, p.on, 0.27f * h, true);
              fit(bp, big, bw, 0.27f * h);
              cv.drawText(big, pad, h - pad - 0.14f * h, bp);
              String lab = "ML OF " + nf(d.goal) + " TODAY";
              Paint lp = tp(tf, p.sub, 0.075f * h, false);
              fit(lp, lab, bw, 0.075f * h);
              cv.drawText(lab, pad, h - pad, lp);
            }
          }
          WJAVAEOF
