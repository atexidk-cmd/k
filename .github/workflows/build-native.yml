name: Build Native APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bunny-debug-key-v1
      - name: Make app
        run: |
          mkdir www
          cp index.html sw.js manifest.json icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/status-bar@6
          echo '{"appId":"io.github.atexidk.bunnyapp","appName":"Bunny","webDir":"www","plugins":{"StatusBar":{"overlaysWebView":true,"style":"LIGHT","backgroundColor":"#00000000"}}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bunny-native
          path: android/app/build/outputs/apk/debug/app-debug.apk
