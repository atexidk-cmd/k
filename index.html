<style>
:root{--app-bg:#AFD13A;--accent:#C6E852;--accent-dark:#557713;--accent-soft:#EAF6CF;--paper:#F4FAE6;--ink:#121410;--ink-soft:#6B7059;--black:#111411;--black-2:#1E211A;--on-black:#F3F7E6;--on-black-soft:#9AA47F;--line:rgba(17,20,17,.1);--danger:#D9536F;--df:'Bricolage Grotesque','Anybody','Archivo Narrow',Impact,sans-serif;--bf:'DM Sans',-apple-system,'Segoe UI',sans-serif}
:root{--done:color-mix(in srgb,var(--accent-dark) 76%,#000)}
:root[data-theme="dark"]{--done:color-mix(in srgb,var(--accent) 50%,#000)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}

/* ===== iOS-style motion system (added) ===== */
:root{--ease-ios:cubic-bezier(.25,.46,.45,.94);--ease-out-ios:cubic-bezier(.22,1,.36,1);--ease-in-ios:cubic-bezier(.55,.06,.68,.19);--spring-soft:cubic-bezier(.34,1.36,.64,1);--spring-bouncy:cubic-bezier(.34,1.7,.5,1);--spring-snappy:cubic-bezier(.3,1.25,.5,1);--dur-instant:90ms;--dur-fast:180ms;--dur-base:300ms;--dur-slow:450ms;--dur-sheet:520ms;--press-scale:.96;--stagger:35ms}
@supports (transition-timing-function:linear(0,1)){:root{--spring-soft:linear(0,.32,.72,.98,1.06,1.05,1.02,1.005,1);--spring-bouncy:linear(0,.28,.66,.97,1.12,1.1,1.04,1.01,1)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}}
html.bg *,html.bg *::before,html.bg *::after{animation-play-state:paused!important}
/* A. one press style, never stacked */
button,.srow,.chips button,.seg button{touch-action:manipulation}
:where(button[data-action]){transition:scale var(--dur-base) var(--spring-soft),filter var(--dur-fast) var(--ease-ios)}
button[data-action]:active{scale:var(--press-scale);filter:brightness(.96);transition-duration:var(--dur-instant),var(--dur-instant)}
nav button[data-action]:active,button.srow:active,.srow.tap:active{filter:none}
.bmain:active,.pcard:active,div.pcard:active,.mood:active svg,.cch button:active .ctile,button:active .bx-swatch{transform:none}
.mood:active svg{scale:1}
div.pcard{transition:none}
/* B. tabs */
#main[data-dir="f"].enter{animation:vInF var(--dur-base) var(--ease-out-ios) both}
#main[data-dir="b"].enter{animation:vInB var(--dur-base) var(--ease-out-ios) both}
@keyframes vInF{from{opacity:0;transform:translateX(16px)}}
@keyframes vInB{from{opacity:0;transform:translateX(-16px)}}
/* C. sheets and alerts */
#modal .box{transform:translateY(20px) scale(.92);transition:transform var(--dur-sheet) var(--spring-soft)}
#modal:not(.show) .box{transition:transform var(--dur-base) var(--ease-in-ios)}
#modal.sheet .box,#modal .box.sheetbox{transform:translateY(100%)}
#modal.show .box{transform:none}
#modal .grab{display:block;position:relative;width:100%;height:30px;margin:-16px 0 -4px;touch-action:none;cursor:grab}
#modal .grab::after{content:"";position:absolute;left:50%;top:12px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:currentColor;opacity:.2}
/* D. staggered entry (view enter only, capped at 8) */
#main.enter>:nth-child(1){animation-delay:calc(var(--stagger)*0)}
.enter .rc:nth-child(1){animation-delay:calc(var(--stagger)*0)}
#main.enter>:nth-child(2){animation-delay:calc(var(--stagger)*1)}

function dayDone(m,d){var c=0;(state.profile.routines||[]).forEach(function(r){if(m.routines[r[0]]&&m.routines[r[0]][d-1])c++});return c}
function monthTotal(m,i){var c=0,d;for(d=1;d<=dim(i);d++)c+=dayDone(m,d);return c}
function fmt(a,b){return state.fmt==="fraction"?a+"/"+b:(b?pct(a/b):0)+"%"}
function rlen(){return(state.profile.routines||[]).length||1}
/* day-of-week aware routine scheduling: routine[5] is a list of weekday numbers (0=Sun..6=Sat) it repeats on, or null/undefined/[] for every day */
function routineOnDay(r,y,mi,d){var days=r[5];if(!days||!days.length)return true;return days.indexOf(new Date(y,mi,d).getDay())>=0}
function activeRoutines(y,mi,d){return(state.profile.routines||[]).filter(function(r){return routineOnDay(r,y,mi,d)})}
function activeCount(y,mi,d){return activeRoutines(y,mi,d).length||1}
function monthExpected(i){var t=0,d,n=dim(i);for(d=1;d<=n;d++)t+=activeCount(YEAR,i,d);return t||1}
var STREAK_MIN=0.5;/* a day counts toward the streak when at least this share of that day's routines is done */
function dayQual(m,mi,d){var a=activeRoutines(YEAR,mi,d);if(!a.length)return null;var c=a.filter(function(r){return m.routines[r[0]]&&m.routines[r[0]][d-1]}).length;return c/a.length>=STREAK_MIN}
function streak(m,upto,mi){mi=mi===undefined?RM:mi;var s=0,d=upto,cm=m,first=true,g=0,q;while(g++<400){q=dayQual(cm,mi,d);if(q===true)s++;else if(q===false){if(!(first&&mi===RM&&d===RD))break}first=false;d--;if(d<1){mi--;if(mi<0)break;cm=gm(mi);d=dim(mi)}}return s}
function rStats(m,id,i){var r=(state.profile.routines||[]).filter(function(x){return x[0]===id})[0],days=r&&r[5],c=0,tot=0,d,n=dim(i);for(d=0;d<n;d++){if(days&&days.length&&days.indexOf(new Date(YEAR,i,d+1).getDay())<0)continue;tot++;if(m.routines[id][d])c++}tot=tot||1;return{done:c,total:tot,pct:c/tot}}
function libFind(id){var i;for(i=0;i<LIBRARY.length;i++)if(LIBRARY[i][0]===id)return LIBRARY[i];return null}
function idsToRoutines(ids){var out=[],i,r;for(i=0;i<ids.length;i++){r=libFind(ids[i]);if(r)out.push([r[0],r[1],r[2],r[3]])}return out}
function slugify(s){return(String(s).toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,20)||"routine")}
function suggestIds(dayType,cats){var pool=LIBRARY.filter(function(r){return cats.indexOf(r[4])>=0});if(pool.length<10){var extra=LIBRARY.filter(function(r){return pool.indexOf(r)<0&&["hydration","meals","sleep"].indexOf(r[4])>=0});pool=pool.concat(extra)}
var seen={},uniq=[];pool.forEach(function(r){if(!seen[r[0]]){seen[r[0]]=true;uniq.push(r)}});pool=uniq;
var pref=(DAYTYPES.filter(function(d){return d[0]===dayType})[0]||[])[2];
pool.sort(function(a,b){var av=a[4]===pref?0:1,bv=b[4]===pref?0:1;return av-bv});
var cap={m:5,s:5,e:5},ct={m:0,s:0,e:0},out=[],i,r;
for(i=0;i<pool.length&&out.length<16;i++){r=pool[i];if(ct[r[2]]<cap[r[2]]){out.push(r);ct[r[2]]++}}
if(out.length<10)for(i=0;i<pool.length&&out.length<10;i++){if(out.indexOf(pool[i])<0)out.push(pool[i])}
return out.map(function(r){return r[0]})}
